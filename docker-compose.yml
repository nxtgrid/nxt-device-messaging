# Local compose stack: app + Valkey 8 (ADR-005 §2).
# Copy `.env.example` → `.env`, then: docker compose up --build
#
# The meter-driver emulator is not part of that stack. Start it on its own:
#   docker compose up meter-driver-emulator

services:
  app:
    build: .
    ports:
      - '${PORT:-3100}:3100'
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3100}
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
    depends_on:
      - valkey
    # Optional: mount a config artifact (ADR-002). Without this, bundled config.default.json is used.
    # volumes:
    #   - ./config.example.json:/app/config.json:ro
    # environment:
    #   DEVICE_MESSAGING_CONFIG_PATH: /app/config.json

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '${REDIS_PUBLISH_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data

  # SparkMeter lab stand-in. A profile keeps `docker compose up` from starting it.
  # `docker compose up meter-driver-emulator` starts this service alone.
  meter-driver-emulator:
    image: ghcr.io/earthspark/meter-driver-emulator:main
    profiles:
      - emulator
    ports:
      - '18080:18080'

volumes:
  valkey-data:
